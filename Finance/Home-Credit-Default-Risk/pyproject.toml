[project]
name = "home-credit-default-risk"
version = "1.0.0"
description = "Binary classification: predict home credit applicants' repayment ability (AUC-ROC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "gdown>=5.0",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

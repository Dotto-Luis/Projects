[project]
name = "openai-agent-toolkit"
version = "1.0.0"
description = "CLI agent that answers natural-language questions about a loan dataset using the OpenAI API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

name: Ecommerce-Performance-Insights tests

on:
  push:
    paths:
      - "Finance/Ecommerce-Performance-Insights/**"
      - ".github/workflows/ecommerce-performance-insights-tests.yml"
  pull_request:
    paths:
      - "Finance/Ecommerce-Performance-Insights/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Finance/Ecommerce-Performance-Insights
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Finance/Ecommerce-Performance-Insights/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests -v

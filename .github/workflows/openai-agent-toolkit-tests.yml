name: OpenAI-Agent-Toolkit tests

on:
  push:
    paths:
      - "Information_Technology/OpenAI-Agent-Toolkit/**"
      - ".github/workflows/openai-agent-toolkit-tests.yml"
  pull_request:
    paths:
      - "Information_Technology/OpenAI-Agent-Toolkit/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Information_Technology/OpenAI-Agent-Toolkit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Information_Technology/OpenAI-Agent-Toolkit/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests -v

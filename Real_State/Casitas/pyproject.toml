[project]
name = "casitas"
version = "1.1"
description = "Real estate investment pipeline for Málaga (Spain) — scraping + local LLM scoring + bilingual PDF report"
readme = "README.md"
authors = [{name = "Luis Dotto"}]
requires-python = ">=3.10"

dependencies = [
    "undetected-chromedriver>=1.3.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=2.0",
    "selenium>=4.0.0",
    "python-dotenv>=1.0",
    "notebook>=7.0.0",
    "ollama>=0.3",
    "duckdb>=0.8.0",
    "matplotlib>=3.7",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
